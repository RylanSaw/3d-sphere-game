<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Physics Sphere & Stars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      touch-action: none;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    #resetBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.75);
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(6px);
    }
    #resetBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <button id="resetBtn">↻ Reset</button>

  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090d16, 0.022);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // အလင်းရောင်များ
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 10, 14);
    scene.add(dirLight);

    const sphereLight = new THREE.PointLight(0x38bdf8, 2.5, 16);
    scene.add(sphereLight);

    // နောက်ခံ 3D ကြယ်မှုန်များ
    const bgGeo = new THREE.BufferGeometry();
    const bgCount = 180;
    const bgPositions = new Float32Array(bgCount * 3);
    for (let i = 0; i < bgCount * 3; i += 3) {
      bgPositions[i] = (Math.random() - 0.5) * 45;
      bgPositions[i + 1] = (Math.random() - 0.5) * 35;
      bgPositions[i + 2] = -3 - Math.random() * 22;
    }
    bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
    const bgMat = new THREE.PointsMaterial({ color: 0x64748b, size: 0.14 });
    const bgStars = new THREE.Points(bgGeo, bgMat);
    scene.add(bgStars);

    // အဓိက 3D စက်လုံး
    const baseRadius = 0.9;
    const sphereGeo = new THREE.SphereGeometry(baseRadius, 36, 36);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      emissive: 0x0284c7,
      emissiveIntensity: 0.45,
      roughness: 0.2,
      metalness: 0.3
    });
    const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphereMesh);

    // လက်ထိထားသည့် နေရာပြ 3D ကွင်း
    const markerGeo = new THREE.RingGeometry(0.32, 0.40, 32);
    const markerMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.45,
      side: THREE.DoubleSide
    });
    const touchMarker = new THREE.Mesh(markerGeo, markerMat);
    touchMarker.visible = false;
    scene.add(touchMarker);

    // Physics ကိန်းသေများ
    const physics = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      targetX: 0,
      targetY: 0,
      scale: 1,
      targetScale: 1
    };
    const spring = 0.02;
    const friction = 0.80;

    // 3D ကြယ်ပုံစံ ဖန်တီးခြင်း
    function createStarGeometry(outerR, innerR) {
      const shape = new THREE.Shape();
      const spikes = 5;
      let rot = (Math.PI / 2) * 3;
      const step = Math.PI / spikes;

      shape.moveTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
      for (let i = 0; i < spikes; i++) {
        shape.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
        rot += step;
        shape.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
        rot += step;
      }
      shape.closePath();

      const extrudeSettings = {
        depth: 0.22,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.07,
        bevelThickness: 0.08
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      return geo;
    }

    const starGeo = createStarGeometry(0.85, 0.38);
    const starMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24,
      emissive: 0xd97706,
      emissiveIntensity: 0.35,
      roughness: 0.25,
      metalness: 0.65
    });

    let stars = [];
    let particles = [];
    let shockwaves = [];

    function getVisibleBounds() {
      const vHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      const vWidth = vHeight * camera.aspect;
      return { vWidth, vHeight };
    }

    function initStars() {
      stars.forEach(s => scene.remove(s.mesh));
      stars = [];

      const { vWidth, vHeight } = getVisibleBounds();
      const positions = [
        { x: -vWidth * 0.24, y: vHeight * 0.22 },
        { x: vWidth * 0.24, y: -vHeight * 0.22 }
      ];

      positions.forEach((pos, index) => {
        const mesh = new THREE.Mesh(starGeo, starMat);
        mesh.position.set(pos.x, pos.y, 0);
        mesh.rotation.y = index * 0.8;
        mesh.rotation.x = 0.25;
        scene.add(mesh);
        stars.push({ mesh, active: true, radius: 0.85 });
      });
    }

    initStars();

    // ကြယ်ထိမိချိန် Effect
    const particleGeo = new THREE.OctahedronGeometry(0.12, 0);
    function trigger3DEffect(x, y) {
      const swGeo = new THREE.RingGeometry(0.4, 0.55, 32);
      const swMat = new THREE.MeshBasicMaterial({
        color: 0xfbbf24,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide
      });
      const swMesh = new THREE.Mesh(swGeo, swMat);
      swMesh.position.set(x, y, 0);
      scene.add(swMesh);
      shockwaves.push({ mesh: swMesh, scale: 1, alpha: 1 });

      const colors = [0xfbbf24, 0xfef08a, 0x38bdf8, 0xffffff];
      for (let i = 0; i < 30; i++) {
        const pMat = new THREE.MeshBasicMaterial({
          color: colors[Math.floor(Math.random() * colors.length)],
          transparent: true,
          opacity: 1
        });
        const pMesh = new THREE.Mesh(particleGeo, pMat);
        pMesh.position.set(x, y, 0);

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = 0.08 + Math.random() * 0.18;

        scene.add(pMesh);
        particles.push({
          mesh: pMesh,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.sin(phi) * Math.sin(theta) * speed,
          vz: Math.cos(phi) * speed,
          alpha: 1
        });
      }
    }

    // Touch / Mouse ထိန်းချုပ်မှု
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectPoint = new THREE.Vector3();

    function updateTargetFromScreen(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      if (raycaster.ray.intersectPlane(planeZ, intersectPoint)) {
        physics.targetX = intersectPoint.x;
        physics.targetY = intersectPoint.y;
        touchMarker.position.set(intersectPoint.x, intersectPoint.y, 0);
        touchMarker.visible = true;
      }
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.id === 'resetBtn') return;
      e.preventDefault();
      updateTargetFromScreen(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.target.id === 'resetBtn') return;
      e.preventDefault();
      updateTargetFromScreen(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.id === 'resetBtn') return;
      isMouseDown = true;
      updateTargetFromScreen(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        updateTargetFromScreen(e.clientX, e.clientY);
      }
    });
    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    // Reset ခလုတ်
    const resetBtn = document.getElementById('resetBtn');
    function resetGame(e) {
      e.stopPropagation();
      physics.x = 0;
      physics.y = 0;
      physics.vx = 0;
      physics.vy = 0;
      physics.targetX = 0;
      physics.targetY = 0;
      physics.scale = 1;
      physics.targetScale = 1;
      touchMarker.visible = false;

      particles.forEach(p => scene.remove(p.mesh));
      particles = [];
      shockwaves.forEach(sw => scene.remove(sw.mesh));
      shockwaves = [];

      initStars();
    }
    resetBtn.addEventListener('click', resetGame);
    resetBtn.addEventListener('touchstart', resetGame, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      const ax = (physics.targetX - physics.x) * spring;
      const ay = (physics.targetY - physics.y) * spring;
      physics.vx = (physics.vx + ax) * friction;
      physics.vy = (physics.vy + ay) * friction;
      physics.x += physics.vx;
      physics.y += physics.vy;

      sphereMesh.position.set(physics.x, physics.y, 0);
      sphereMesh.rotation.y += physics.vx * 0.4;
      sphereMesh.rotation.x -= physics.vy * 0.4;
      sphereLight.position.set(physics.x, physics.y, 1.8);

      physics.scale += (physics.targetScale - physics.scale) * 0.12;
      sphereMesh.scale.set(physics.scale, physics.scale, physics.scale);
      const currentSphereRadius = baseRadius * physics.scale;

      for (let star of stars) {
        if (!star.active) continue;

        star.mesh.rotation.y += 0.03;
        star.mesh.rotation.z = Math.sin(Date.now() * 0.002) * 0.2;

        const dist = Math.hypot(physics.x - star.mesh.position.x, physics.y - star.mesh.position.y);
        if (dist < currentSphereRadius + star.radius) {
          star.active = false;
          star.mesh.visible = false;
          physics.targetScale += 0.35;
          sphereLight.intensity = 5.5;
          trigger3DEffect(star.mesh.position.x, star.mesh.position.y);
        }
      }

      if (sphereLight.intensity > 2.5) {
        sphereLight.intensity += (2.5 - sphereLight.intensity) * 0.1;
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 0.22;
        sw.alpha -= 0.035;
        sw.mesh.scale.set(sw.scale, sw.scale, 1);
        sw.mesh.material.opacity = sw.alpha;

        if (sw.alpha <= 0) {
          scene.remove(sw.mesh);
          sw.mesh.geometry.dispose();
          sw.mesh.material.dispose();
          shockwaves.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.vz *= 0.94;
        p.mesh.rotation.x += 0.1;
        p.mesh.rotation.y += 0.1;
        p.alpha -= 0.025;
        p.mesh.material.opacity = p.alpha;

        if (p.alpha <= 0) {
          scene.remove(p.mesh);
          p.mesh.material.dispose();
          particles.splice(i, 1);
        }
      }

      bgStars.rotation.y += 0.0005;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
  </html>
