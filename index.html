<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Star & Moon Catcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- စစဝင်ချင်း ပေါ်မည့် Start Screen UI -->
  <div id="startOverlay">
    <div class="start-card">
      <div class="game-icon">✦ ☾</div>
      <h1 class="game-title">3D ကြယ်နှင့်လ ဖမ်းဂိမ်း</h1>
      <p class="game-subtitle">Screen ကို လက်ဖြင့်ထိပြီး ကြယ်နှင့်လများကို လိုက်ဖမ်းပါ</p>

      <a href="https://github.com/RylanSaw" target="_blank" rel="noopener noreferrer" class="creator-box">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span>ပြုလုပ်သူ - Rylan Saw ↗</span>
      </a>

      <button id="startBtn">▶ START</button>
    </div>
  </div>

  <!-- ဂိမ်းကစားနေစဉ် ပြသမည့် အရေအတွက်နှင့် အချိန်နာရီ -->
  <div id="hud">
    <div class="hud-left">
      <div id="hitBadge" class="hud-pill">✦ တိုက်မိမှု: 0</div>
      <div id="timeBadge" class="hud-pill">⏱ 00:00</div>
    </div>
    <button id="resetBtn">↻ Reset</button>
  </div>

  <!-- Three.js Library နှင့် ပင်မ Script ဖိုင်ချိတ်ဆက်ခြင်း -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
